name: Backend Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/backend-gate.yml"

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend gate
        run: npm test
